Use specification-driven acceptance and selective DDD vocabulary, not a domain-framework rewrite.
Cite source locations; distinguish intended rules from current compliance and unverified target/toolchain behavior.
Stay read-only. No builds for prose, hardware, publishing, dependency upgrades or recursive delegation without scope.
