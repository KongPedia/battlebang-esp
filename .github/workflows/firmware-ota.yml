name: Firmware OTA Releases
run-name: Firmware OTA Releases

on:
  push:
    branches:
      - main
    # Monorepo firmware trigger: host-only provisioning/MQTT helper edits do not
    # publish OTA assets unless they are part of firmware generation itself.
    paths:
      - ".github/workflows/firmware-ota.yml"
      - "platformio.ini"
      - "firmware/boss_target/**"
      - "firmware/go2/**"
      - "firmware/go2_nixo/**"
      - "firmware/go2_nixo_framed_packet_uart/**"
      - "firmware/heavy_blaster/**"
      - "firmware/station/**"
      - "firmware/turret_fleet/**"
      - "scripts/firmware/make_release_manifest.py"
      - "scripts/go2_config.py"
      - "scripts/go2_nixo_config.py"
      - "lib/bb_esp_core/**"
      - "lib/bb_esp_hw/**"
      - "lib/bb_esp_net/**"
      - "lib/bb_esp_nvs/**"
      - "lib/bb_esp_ota/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version label for the artifact"
        required: true
        default: "0.1.0-manual"
      build:
        description: "Numeric firmware build. Must increase for OTA version checks."
        required: true
        default: "1"
      firmware_base_url:
        description: "Optional HTTP base URL reachable by ESP32 devices, e.g. http://COMMAND_CENTER_IP_OR_DNS:8080/firmware"
        required: false
        default: ""
      public_release_repo:
        description: "Public repository that hosts firmware releases. Same-repo releases use GITHUB_TOKEN; cross-repo releases need PUBLIC_RELEASE_REPO_TOKEN."
        required: true
        default: "KongPedia/battlebang-esp"
      public_release_target_branch:
        description: "Target branch in the public release repository used when creating a new release tag"
        required: true
        default: "main"
      create_release:
        description: "Create/update a Release in the public firmware repository"
        required: true
        type: boolean
        default: true
      update_stable_latest:
        description: "Update firmware-specific stable latest tags. Keep false for branch smoke tests; main pushes always update latest."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.has_changes }}
      matrix: ${{ steps.filter.outputs.matrix }}
      selected: ${{ steps.filter.outputs.selected }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected firmware release jobs
        id: filter
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          firmware_jobs = [
              {
                  "id": "boss-target",
                  "env": "esp32dev_boss_target",
                  "app": "battlebang-boss-target",
                  "hardware": "esp32dev-boss-target-ring-v1",
                  "channel": "boss-target",
                  "artifact_prefix": "battlebang-boss-target",
                  "manifest_name": "boss-target-manifest.json",
                  "version_header": "firmware/boss_target/app/version_autogen.h",
                  "version_macro": "BB_BOSS_TARGET_VERSION",
                  "build_macro": "BB_BOSS_TARGET_BUILD",
                  "git_macro": "BB_BOSS_TARGET_GIT_SHA",
                  "version_tag_prefix": "boss-target-v",
                  "stable_tag": "boss-target-latest",
                  "paths": [r"^firmware/boss_target/", r"^lib/bb_esp_core/", r"^lib/bb_esp_net/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "go2",
                  "env": "esp32dev_go2",
                  "app": "battlebang-go2",
                  "hardware": "esp32dev-go2-hit-led-v1",
                  "channel": "go2",
                  "artifact_prefix": "battlebang-go2",
                  "manifest_name": "go2-manifest.json",
                  "version_header": "firmware/go2/app/version_autogen.h",
                  "version_macro": "BB_GO2_VERSION",
                  "build_macro": "BB_GO2_BUILD",
                  "git_macro": "BB_GO2_GIT_SHA",
                  "version_tag_prefix": "go2-v",
                  "stable_tag": "go2-latest",
                  "paths": [r"^firmware/go2/", r"^scripts/go2_config\.py$", r"^lib/bb_esp_core/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "go2-nixo-1ch",
                  "env": "esp32dev_go2_nixo_1ch",
                  "app": "battlebang-go2-nixo",
                  "hardware": "esp32dev-go2-nixo-relay-1ch-v1",
                  "channel": "go2-nixo-1ch",
                  "artifact_prefix": "battlebang-go2-nixo-1ch",
                  "manifest_name": "go2-nixo-1ch-manifest.json",
                  "version_header": "firmware/go2_nixo/app/version_autogen.h",
                  "version_macro": "BB_GO2_NIXO_VERSION",
                  "build_macro": "BB_GO2_NIXO_BUILD",
                  "git_macro": "BB_GO2_NIXO_GIT_SHA",
                  "version_tag_prefix": "go2-nixo-1ch-v",
                  "stable_tag": "go2-nixo-1ch-latest",
                  "paths": [r"^firmware/go2_nixo/", r"^scripts/go2_nixo_config\.py$", r"^lib/bb_esp_core/", r"^lib/bb_esp_hw/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "go2-nixo-2ch",
                  "env": "esp32dev_go2_nixo_2ch",
                  "app": "battlebang-go2-nixo",
                  "hardware": "esp32dev-go2-nixo-relay-2ch-v1",
                  "channel": "go2-nixo-2ch",
                  "artifact_prefix": "battlebang-go2-nixo-2ch",
                  "manifest_name": "go2-nixo-2ch-manifest.json",
                  "version_header": "firmware/go2_nixo/app/version_autogen.h",
                  "version_macro": "BB_GO2_NIXO_VERSION",
                  "build_macro": "BB_GO2_NIXO_BUILD",
                  "git_macro": "BB_GO2_NIXO_GIT_SHA",
                  "version_tag_prefix": "go2-nixo-2ch-v",
                  "stable_tag": "go2-nixo-2ch-latest",
                  "paths": [r"^firmware/go2_nixo/", r"^scripts/go2_nixo_config\.py$", r"^lib/bb_esp_core/", r"^lib/bb_esp_hw/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "go2-nixo-framed-packet-uart-1ch",
                  "env": "esp32dev_go2_nixo_framed_packet_uart_1ch",
                  "app": "battlebang-go2-nixo-framed-packet-uart",
                  "hardware": "esp32dev-go2-nixo-relay-1ch-v1",
                  "channel": "go2-nixo-framed-packet-uart-1ch",
                  "artifact_prefix": "battlebang-go2-nixo-framed-packet-uart-1ch",
                  "manifest_name": "go2-nixo-framed-packet-uart-1ch-manifest.json",
                  "version_header": "firmware/go2_nixo_framed_packet_uart/app/version_autogen.h",
                  "version_macro": "BB_GO2_NIXO_VERSION",
                  "build_macro": "BB_GO2_NIXO_BUILD",
                  "git_macro": "BB_GO2_NIXO_GIT_SHA",
                  "version_tag_prefix": "go2-nixo-framed-packet-uart-1ch-v",
                  "stable_tag": "go2-nixo-framed-packet-uart-1ch-latest",
                  "paths": [r"^firmware/go2_nixo/", r"^firmware/go2_nixo_framed_packet_uart/", r"^scripts/go2_nixo_config\.py$", r"^lib/bb_esp_core/", r"^lib/bb_esp_hw/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "go2-nixo-framed-packet-uart-2ch",
                  "env": "esp32dev_go2_nixo_framed_packet_uart_2ch",
                  "app": "battlebang-go2-nixo-framed-packet-uart",
                  "hardware": "esp32dev-go2-nixo-relay-2ch-v1",
                  "channel": "go2-nixo-framed-packet-uart-2ch",
                  "artifact_prefix": "battlebang-go2-nixo-framed-packet-uart-2ch",
                  "manifest_name": "go2-nixo-framed-packet-uart-2ch-manifest.json",
                  "version_header": "firmware/go2_nixo_framed_packet_uart/app/version_autogen.h",
                  "version_macro": "BB_GO2_NIXO_VERSION",
                  "build_macro": "BB_GO2_NIXO_BUILD",
                  "git_macro": "BB_GO2_NIXO_GIT_SHA",
                  "version_tag_prefix": "go2-nixo-framed-packet-uart-2ch-v",
                  "stable_tag": "go2-nixo-framed-packet-uart-2ch-latest",
                  "paths": [r"^firmware/go2_nixo/", r"^firmware/go2_nixo_framed_packet_uart/", r"^scripts/go2_nixo_config\.py$", r"^lib/bb_esp_core/", r"^lib/bb_esp_hw/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "heavy-blaster",
                  "env": "esp32dev_heavy_blaster",
                  "app": "battlebang-heavy-blaster",
                  "hardware": "esp32dev-heavy-blaster-matrix-v1",
                  "channel": "heavy-blaster",
                  "artifact_prefix": "battlebang-heavy-blaster",
                  "manifest_name": "heavy-blaster-manifest.json",
                  "version_header": "firmware/heavy_blaster/app/version_autogen.h",
                  "version_macro": "BB_HEAVY_BLASTER_VERSION",
                  "build_macro": "BB_HEAVY_BLASTER_BUILD",
                  "git_macro": "BB_HEAVY_BLASTER_GIT_SHA",
                  "version_tag_prefix": "heavy-blaster-v",
                  "stable_tag": "heavy-blaster-latest",
                  "paths": [r"^firmware/heavy_blaster/", r"^lib/bb_esp_core/", r"^lib/bb_esp_net/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "station",
                  "env": "esp32dev_station",
                  "app": "battlebang-station",
                  "hardware": "esp32dev-target-station-v1",
                  "channel": "station",
                  "artifact_prefix": "battlebang-station",
                  "manifest_name": "station-manifest.json",
                  "version_header": "firmware/station/app/version_autogen.h",
                  "version_macro": "BB_STATION_VERSION",
                  "build_macro": "BB_STATION_BUILD",
                  "git_macro": "BB_STATION_GIT_SHA",
                  "version_tag_prefix": "station-v",
                  "stable_tag": "station-latest",
                  "paths": [r"^firmware/station/", r"^lib/bb_esp_core/", r"^lib/bb_esp_net/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
              {
                  "id": "turret-fleet",
                  "env": "esp32dev_turret_fleet",
                  "app": "battlebang-turret-fleet",
                  "hardware": "esp32dev-turret-v2",
                  "channel": "stable",
                  "artifact_prefix": "battlebang-turret-fleet",
                  "manifest_name": "manifest.json",
                  "version_header": "firmware/turret_fleet/app/version_autogen.h",
                  "version_macro": "BB_TURRET_FLEET_VERSION",
                  "build_macro": "BB_TURRET_FLEET_BUILD",
                  "git_macro": "BB_TURRET_FLEET_GIT_SHA",
                  "version_tag_prefix": "turret-fleet-v",
                  "stable_tag": "turret-fleet-latest",
                  "paths": [r"^firmware/turret_fleet/", r"^lib/bb_esp_core/", r"^lib/bb_esp_net/", r"^lib/bb_esp_nvs/", r"^lib/bb_esp_ota/"],
              },
          ]

          always_all_paths = [
              r"^\.github/workflows/firmware-ota\.yml$",
              r"^platformio\.ini$",
              r"^scripts/firmware/make_release_manifest\.py$",
          ]

          def changed_files() -> list[str]:
              if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
                  return ["__workflow_dispatch__"]

              event_path = os.environ.get("GITHUB_EVENT_PATH")
              event = json.loads(Path(event_path).read_text()) if event_path else {}
              before = event.get("before") or ""
              sha = os.environ["GITHUB_SHA"]
              zero = "0" * 40

              if not before or before == zero:
                  try:
                      before = subprocess.check_output(
                          ["git", "rev-parse", f"{sha}^"],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      ).strip()
                  except subprocess.CalledProcessError:
                      before = ""

              if before:
                  diff = subprocess.check_output(
                      ["git", "diff", "--name-only", before, sha],
                      text=True,
                  )
              else:
                  diff = subprocess.check_output(
                      ["git", "show", "--pretty=", "--name-only", sha],
                      text=True,
                  )
              return [line.strip() for line in diff.splitlines() if line.strip()]

          files = changed_files()

          def any_match(patterns: list[str]) -> bool:
              return any(re.search(pattern, path) for path in files for pattern in patterns)

          selected = []
          for job in firmware_jobs:
              if files == ["__workflow_dispatch__"] or any_match(always_all_paths + job["paths"]):
                  selected.append({k: v for k, v in job.items() if k != "paths"})

          print(f"has_changes={'true' if selected else 'false'}")
          print("selected=" + ",".join(job["id"] for job in selected))
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Derive firmware version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            FIRMWARE_BASE_URL="${{ inputs.firmware_base_url }}"
            PUBLIC_REPO="${{ inputs.public_release_repo }}"
            TARGET_BRANCH="${{ inputs.public_release_target_branch }}"
            CREATE_RELEASE="${{ inputs.create_release }}"
            UPDATE_STABLE_LATEST="${{ inputs.update_stable_latest }}"
          else
            VERSION="0.2.${GITHUB_RUN_NUMBER}-main"
            BUILD="$((1000 + GITHUB_RUN_NUMBER))"
            FIRMWARE_BASE_URL=""
            PUBLIC_REPO="${GITHUB_REPOSITORY}"
            TARGET_BRANCH="${GITHUB_REF_NAME}"
            CREATE_RELEASE="true"
            UPDATE_STABLE_LATEST="true"
          fi

          if ! [[ "${BUILD}" =~ ^[0-9]+$ ]]; then
            echo "build must be numeric, got: ${BUILD}" >&2
            exit 2
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "firmware_base_url=${FIRMWARE_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "public_release_repo=${PUBLIC_REPO}" >> "$GITHUB_OUTPUT"
          echo "public_release_target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "update_stable_latest=${UPDATE_STABLE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Generate firmware version header
        shell: bash
        run: |
          cat > "${{ matrix.version_header }}" <<EOF_VERSION
          #pragma once
          #define ${{ matrix.version_macro }} "${{ steps.version.outputs.version }}"
          #define ${{ matrix.build_macro }} ${{ steps.version.outputs.build }}
          #define ${{ matrix.git_macro }} "${GITHUB_SHA}"
          EOF_VERSION

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          FIRMWARE_NAME="${{ matrix.artifact_prefix }}-${{ steps.version.outputs.version }}.bin"
          MANIFEST_NAME="${{ matrix.manifest_name }}"
          BASE_URL="${{ steps.version.outputs.firmware_base_url }}"
          PUBLIC_REPO="${{ steps.version.outputs.public_release_repo }}"
          VERSION_TAG="${{ matrix.version_tag_prefix }}${{ steps.version.outputs.version }}"
          if [[ -n "${BASE_URL}" ]]; then
            FIRMWARE_URL="${BASE_URL%/}/${FIRMWARE_NAME}"
          elif [[ "${{ steps.version.outputs.create_release }}" == "true" ]]; then
            FIRMWARE_URL="https://github.com/${PUBLIC_REPO}/releases/download/${VERSION_TAG}/${FIRMWARE_NAME}"
          else
            FIRMWARE_URL=""
          fi
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "dist/${FIRMWARE_NAME}"
          shasum -a 256 "dist/${FIRMWARE_NAME}" > dist/sha256.txt
          python scripts/firmware/make_release_manifest.py \
            --firmware "dist/${FIRMWARE_NAME}" \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --app "${{ matrix.app }}" \
            --hardware "${{ matrix.hardware }}" \
            --channel "${{ matrix.channel }}" \
            --url "${FIRMWARE_URL}" \
            --output "dist/${MANIFEST_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-firmware-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Create GitHub Release for tag
        if: steps.version.outputs.create_release == 'true'
        env:
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_REPO_TOKEN: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION_TAG="${{ matrix.version_tag_prefix }}${{ steps.version.outputs.version }}"
          STABLE_TAG="${{ matrix.stable_tag }}"
          PUBLIC_REPO="${{ steps.version.outputs.public_release_repo }}"
          TARGET_BRANCH="${{ steps.version.outputs.public_release_target_branch }}"
          UPDATE_STABLE_LATEST="${{ steps.version.outputs.update_stable_latest }}"
          if [[ "${PUBLIC_REPO}" == "${GITHUB_REPOSITORY}" ]]; then
            export GH_TOKEN="${DEFAULT_GITHUB_TOKEN}"
          else
            export GH_TOKEN="${PUBLIC_RELEASE_REPO_TOKEN}"
            if [[ -z "${GH_TOKEN}" ]]; then
              echo "Cross-repo release to ${PUBLIC_REPO} requires repository secret PUBLIC_RELEASE_REPO_TOKEN." >&2
              echo "Same-repo public releases to ${GITHUB_REPOSITORY} use the built-in GITHUB_TOKEN." >&2
              exit 2
            fi
          fi

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing GitHub token." >&2
            exit 2
          fi

          target_branch_sha() {
            gh api "repos/${PUBLIC_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha'
          }

          RELEASE_TARGET_SHA="${GITHUB_SHA}"
          if [[ "${PUBLIC_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
            RELEASE_TARGET_SHA="$(target_branch_sha)"
          fi

          tag_sha() {
            local tag="$1"
            local existing_sha
            if existing_sha="$(gh api "repos/${PUBLIC_REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              printf '%s\n' "${existing_sha}"
            fi
          }

          ensure_version_tag_available() {
            local tag="$1"
            local target_sha="$2"
            local existing_sha
            existing_sha="$(tag_sha "${tag}")"
            if [[ -n "${existing_sha}" && "${existing_sha}" != "${target_sha}" ]]; then
              echo "Version tag ${tag} already points at ${existing_sha}; refusing to overwrite immutable audit tag for ${target_sha}." >&2
              exit 2
            fi
          }

          move_tag_to_target() {
            local tag="$1"
            local target_sha="$2"
            local existing_sha
            existing_sha="$(tag_sha "${tag}")"
            if [[ -n "${existing_sha}" ]]; then
              gh api -X PATCH "repos/${PUBLIC_REPO}/git/refs/tags/${tag}" \
                -f sha="${target_sha}" \
                -F force=true >/dev/null
            else
              gh api -X POST "repos/${PUBLIC_REPO}/git/refs" \
                -f ref="refs/tags/${tag}" \
                -f sha="${target_sha}" >/dev/null
            fi
          }

          upload_release() {
            local tag="$1"
            local title="$2"
            local notes="$3"
            local mutable_tag="${4:-false}"
            if [[ "${mutable_tag}" == "true" ]]; then
              move_tag_to_target "${tag}" "${RELEASE_TARGET_SHA}"
            else
              ensure_version_tag_available "${tag}" "${RELEASE_TARGET_SHA}"
            fi

            if gh release view "${tag}" -R "${PUBLIC_REPO}" >/dev/null 2>&1; then
              gh release upload "${tag}" dist/* -R "${PUBLIC_REPO}" --clobber
              gh release edit "${tag}" -R "${PUBLIC_REPO}" --target "${RELEASE_TARGET_SHA}" --latest=false --title "${title}" --notes "${notes}"
            else
              gh release create "${tag}" dist/* \
                -R "${PUBLIC_REPO}" \
                --target "${RELEASE_TARGET_SHA}" \
                --title "${title}" \
                --latest=false \
                --notes "${notes}"
            fi
          }

          upload_release "${VERSION_TAG}" "BattleBang ${{ matrix.id }} ${{ steps.version.outputs.version }}" \
            "BattleBang ${{ matrix.id }} firmware version ${{ steps.version.outputs.version }} build ${{ steps.version.outputs.build }} built from private source commit ${GITHUB_SHA}." \
            "false"
          if [[ "${UPDATE_STABLE_LATEST}" == "true" ]]; then
            upload_release "${STABLE_TAG}" "BattleBang ${{ matrix.id }} latest (${{ steps.version.outputs.version }} build ${{ steps.version.outputs.build }})" \
              "Stable ${{ matrix.channel }} OTA manifest for version ${{ steps.version.outputs.version }} build ${{ steps.version.outputs.build }}. Devices poll /releases/download/${STABLE_TAG}/${{ matrix.manifest_name }}; firmware URLs inside the manifest still point at versioned release assets." \
              "true"
          else
            echo "Skipping ${STABLE_TAG}; update_stable_latest=false keeps branch smoke builds from moving device polling pointers."
          fi
