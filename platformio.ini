[platformio]
default_envs = esp32dev_turret_5

; BattleBang Go2 hit/LED ESP firmware.
; Hardware defaults come from firmware/go2/hardware_profile.json.
; Device identity (go2_01/go2_02/...) is provisioned into NVS at runtime, not encoded in env names.
; Local Wi-Fi/MQTT env overrides remain bench fallbacks; production uses provisioning.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -Ifirmware

extra_scripts =
  pre:scripts/go2_config.py

build_src_filter =
  +<../firmware/go2/main.cpp>
  +<../firmware/go2/config/**>
  +<../firmware/go2/display/bar_display.cpp>
  +<../firmware/go2/mqtt/**>
  -<../firmware/go2/sensors/**>
  -<../firmware/go2_nixo/**>
  -<hit_target/**>
  -<../firmware/boss_target/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>

[env:esp32dev_go2]
extends = env:esp32dev

[env:esp32dev_go2_nixo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
custom_nixo_variant = relay_2ch

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -Ifirmware

extra_scripts =
  pre:scripts/go2_nixo_config.py

build_src_filter =
  +<../firmware/go2_nixo/**>
  -<../firmware/go2_nixo/uart/**>
  -<../firmware/go2/**>
  -<hit_target/**>
  -<../firmware/boss_target/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>

[env:esp32dev_go2_nixo_1ch]
extends = env:esp32dev_go2_nixo
custom_nixo_variant = relay_1ch

[env:esp32dev_go2_nixo_2ch]
extends = env:esp32dev_go2_nixo
custom_nixo_variant = relay_2ch

[env:esp32dev_go2_nixo_1ch_packet_v2]
extends = env:esp32dev_go2_nixo_1ch
build_flags =
  ${env:esp32dev_go2_nixo_1ch.build_flags}
  -DGO2_NIXO_UART_PACKET_V2=1
build_src_filter =
  ${env:esp32dev_go2_nixo.build_src_filter}
  +<../firmware/go2_nixo/uart/**>

[env:esp32dev_go2_nixo_2ch_packet_v2]
extends = env:esp32dev_go2_nixo_2ch
build_flags =
  ${env:esp32dev_go2_nixo_2ch.build_flags}
  -DGO2_NIXO_UART_PACKET_V2=1
build_src_filter =
  ${env:esp32dev_go2_nixo.build_src_filter}
  +<../firmware/go2_nixo/uart/**>

[env:esp32dev_nixo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
custom_nixo_variant = relay_1ch

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

extra_scripts =
  pre:scripts/nixo_config.py

build_src_filter =
  +<nIxo/main.cpp>
  -<../firmware/go2/**>
  -<../firmware/go2_nixo/**>
  -<hit_target/**>
  -<../firmware/boss_target/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>

[env:esp32dev_nixo_1ch]
extends = env:esp32dev_nixo
custom_nixo_variant = relay_1ch

[env:esp32dev_nixo_2ch]
extends = env:esp32dev_nixo
custom_nixo_variant = relay_2ch

[env:esp32dev_hit_target]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
