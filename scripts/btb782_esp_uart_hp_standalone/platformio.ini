[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
  fastled/FastLED@^3.7.0

build_flags =
  -D BTB782_UART_RX_PIN=16
  -D BTB782_UART_TX_PIN=17
  -D BTB782_UART_BAUD=115200
  -D BTB782_LED_PIN=18
  -D BTB782_NUM_LEDS=84
  -D BTB782_HP_BAR_GROUP_COUNT=28
  -D BTB782_HP_BAR_LEDS_PER_GROUP=3
  -D BTB782_LED_SHOW_PERIOD_MS=16
  -D BTB782_LED_BLINK_MS=250
  -D BTB782_LED_DEAD_BLINK_MS=300
  -D BTB782_LED_MAX_VOLTS=5
  -D BTB782_LED_MAX_MA=900
  -D BTB782_LED_BRIGHTNESS=120
  -D BTB782_LEFT_PIEZO_PIN=34
  -D BTB782_RIGHT_PIEZO_PIN=35
  -D BTB782_FRONT_PIEZO_PIN=32
  -D BTB782_PIEZO_THRESHOLD_RAW=2400
  -D BTB782_PIEZO_REARM_RAW=1800
  -D BTB782_CAPTURE_WINDOW_MS=30
  -D BTB782_REARM_STABLE_MS=30
  -D BTB782_HP_MAX=14
  -D BTB782_HP_TX_PERIOD_MS=100
  -D BTB782_DEBUG_PERIOD_MS=1000
  -D BTB782_NIXO_RELAY1_PIN=23
  -D BTB782_NIXO_RELAY2_PIN=-1
  -D BTB782_NIXO_RELAY_ON_LEVEL=1
  -D BTB782_NIXO_RELAY_OFF_LEVEL=0
  -D BTB782_NIXO_PREFIRE_DELAY_MS=600
  -D BTB782_NIXO_RELAY_DELAY1_MS=800
  -D BTB782_NIXO_FIRE_DEFAULT_DURATION_MS=3000
  -D BTB782_NIXO_FIRE_MIN_DURATION_MS=100
  -D BTB782_NIXO_FIRE_MAX_DURATION_MS=10000
  -D BTB782_NIXO_FIRE_COOLDOWN_MS=1500
