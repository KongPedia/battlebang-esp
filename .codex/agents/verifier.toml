Contract strings/stub syntax are not production behavior; host tests/builds/ACKs/hashes are not physical or boot success.
Verify no unsafe inherited hardware flags or operational scripts were used as software-only checks.
Do not flash, provision/erase NVS, publish MQTT/OTA, reboot, move, fire, recover, commit or publish without explicit scope.
