  -<../firmware/boss_target/**>
  -<nIxo/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>


; Boss-stage target firmware: 4 target LED rings + 4 piezo DO inputs + HP bar.
; Runtime provisioning stores identity, Wi-Fi/MQTT, gameplay, and OTA policy in NVS.
[env:esp32dev_boss_target]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -Ifirmware

build_src_filter =
  +<../firmware/boss_target/**>
  -<../firmware/go2/**>
  -<../firmware/go2_nixo/**>
  -<hit_target/**>
  -<nIxo/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>


; Heavy Blaster station firmware: four matrix slots + local relay unlock.
; Product-facing paths/topics use heavy-blaster / heavy-blasters; C++ symbols and
; PlatformIO env names stay underscore-safe.
[env:esp32dev_heavy_blaster]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -Ifirmware

build_src_filter =
  +<../firmware/heavy_blaster/**>
  -<../firmware/go2/**>
  -<../firmware/go2_nixo/**>
  -<hit_target/**>
  -<../firmware/boss_target/**>
  -<nIxo/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>
  -<../firmware/station/**>

; Target Station firmware: one piezo impact sensor + local Station LEDs.
; Per-board station_id, Wi-Fi, MQTT broker, and OTA policy are provisioned into NVS over USB serial.
[env:esp32dev_station]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 57600
board_build.partitions = min_spiffs.csv

lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
  symlink://lib/bb_esp_net

build_flags =
  -Ifirmware

build_src_filter =
  +<../firmware/station/**>
  -<../firmware/go2/**>
  -<../firmware/go2_nixo/**>
  -<hit_target/**>
  -<../firmware/boss_target/**>
  -<../firmware/heavy_blaster/**>
  -<nIxo/**>
  -<turret/**>
  -<../firmware/turret_fleet/**>
  -<test.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>


; MQTT turret firmware.
; Per-turret install coordinates come from src/turret/turrets.json.
; Local Wi-Fi/MQTT secrets come from gitignored src/turret/local_secrets.h or env vars read by scripts/turret_config.py.
[env:esp32dev_turret]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  madhephaestus/ESP32Servo@^3.0.6
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

extra_scripts =
  pre:scripts/turret_config.py

build_src_filter =
  +<turret/main.cpp>
  -<../firmware/go2_nixo/**>
  -<../firmware/boss_target/**>
  -<turret/main_turret.cpp>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>
  -<turret_wifi_probe.cpp>
  -<turret_legacy_mqtt_probe.cpp>

[env:esp32dev_turret_1]
extends = env:esp32dev_turret
custom_turret_id = turret_1

[env:esp32dev_turret_2]
extends = env:esp32dev_turret
custom_turret_id = turret_2

[env:esp32dev_turret_3]
extends = env:esp32dev_turret
custom_turret_id = turret_3

[env:esp32dev_turret_4]
extends = env:esp32dev_turret
custom_turret_id = turret_4

[env:esp32dev_turret_5]
extends = env:esp32dev_turret
custom_turret_id = turret_5

[env:esp32dev_turret_6]
extends = env:esp32dev_turret
custom_turret_id = turret_6

; Future fleet firmware path.
; This does not replace src/turret/ yet. It builds a generic firmware that reads
; turret identity/coordinates from runtime config stored in ESP32 NVS.
[env:esp32dev_turret_fleet]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  madhephaestus/ESP32Servo@^3.0.6
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -Ifirmware

build_src_filter =
  +<../firmware/turret_fleet/**>
  -<../firmware/go2_nixo/**>
  -<../firmware/boss_target/**>
  -<../firmware/heavy_blaster/**>
  -<../firmware/station/**>
  -<turret/main.cpp>
  -<turret/main_turret.cpp>
  -<turret_demo.cpp>
  -<turret_demo_v2_mod.cpp>

; Native unit tests (host PC; ESP32 firmware sources excluded)
[env:native]
platform = native
build_src_filter = -<*>
test_framework = googletest
lib_ignore = FastLED

[env:native_go2_nixo_uart_packet_v2]
platform = native
test_framework = googletest
test_build_src = true
test_filter = test_go2_nixo_uart_packet_v2
build_flags = -Ifirmware
build_src_filter =
  +<../firmware/go2_nixo/uart/protocol.cpp>
  +<../firmware/go2_nixo/uart/runtime.cpp>
  -<../firmware/station/**>
